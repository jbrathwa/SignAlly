[project]
name = "recognition"
version = "0.1.0"
description = "Camera in, glosses out. The orchestrator's one upstream."
requires-python = ">=3.12,<3.13"
dependencies = ["islkit>=0.2,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
