# Sketch profile for the panel relay. Mirrors the App Lab examples exactly
# (core-and-foundational/03-bridge-basics): the platform supplies
# Arduino_RouterBridge, so `libraries` stays empty.
#
# App Lab compiles and flashes this whenever the app starts. The relay must
# live here -- App Lab discovers a sketch only at <app>/sketch/sketch.ino, and
# a copy kept outside the app is never flashed.
profiles:
  default:
    platforms:
      - platform: arduino:zephyr
    libraries:
default_profile: default
