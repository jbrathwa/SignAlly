[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor & Upload Options
monitor_speed = 115200

; 115200, not 921600. The display-path spike measured 921600 failing on this
; unit's CH340 ("Invalid head of packet"), and esptool reaches the same end from
; the other direction: it syncs, switches to the faster rate, and the chip stops
; responding mid-flash. Verified again 2026-09-07.
upload_speed = 115200

; upload_port / monitor_port are deliberately NOT pinned here. They used to say
; COM5, a Windows leftover that is wrong on every machine now in use, and the
; CH340's node floats anyway -- it moved 11110 -> 3110 -> 3120 in one day
; without being unplugged. Pass it per invocation instead:
;
;   pio run -e esp32dev -t upload --upload-port $(ls /dev/cu.usbserial-* | head -1)
;
; Always pass it. With the UNO Q also on USB, auto-detection picks the Arduino
; and fails with "No serial data received", which reads exactly like a board
; that needs BOOT held.

; CPU & Flash Configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.filesystem = littlefs

; External Dependencies
lib_deps = 
    https://github.com/lvgl/lvgl.git#v8.3.3
    bblanchon/ArduinoJson@6.21.4

; Compiler Flags & Include Paths
build_flags = 
    -D LV_CONF_INCLUDE_SIMPLE
    -D CORE_DEBUG_LEVEL=3
    -I include
    -O2
    -Wall
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TOUCH_CS=33
